<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>ProveedorConecta Nicaragua</title>
  <script>
    // GitHub Pages SPA redirect workaround
    // This script takes the current URL and converts the path and query string
    // into just a query string, and then redirects to index.html
    var pathSegmentsToKeep = 1; // Repo is served under /hakaton/ subpath on GitHub Pages
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body>
  Redirecting...
</body>
</html>
