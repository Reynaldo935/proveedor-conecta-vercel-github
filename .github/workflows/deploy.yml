# ProveedorConecta Nicaragua - CI Pipeline
# Runs lint and build checks on every push/PR
# Vercel handles deployment automatically via GitHub integration

name: CI - Lint & Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (includes Prisma generate + Next.js build + TypeScript check)
        run: npm run build
        env:
          DATABASE_URL: file:./db/ci.db
          TURSO_DATABASE_URL: ""
          TURSO_AUTH_TOKEN: ""
