# ProveedorConecta Nicaragua - CI Pipeline
# Runs lint and type checks on every push/PR
# Vercel handles deployment automatically via GitHub integration

name: CI - Lint & Type Check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Generate Prisma client
        run: bun run db:generate
        env:
          DATABASE_URL: file:./db/ci.db

      - name: Run ESLint
        run: bun run lint
        continue-on-error: true

      - name: Type check
        run: bunx tsc --noEmit
        continue-on-error: true
